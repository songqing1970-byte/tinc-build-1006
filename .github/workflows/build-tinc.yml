name: Static Tinc 1.0.36 Build BE3600 ARMv7hf Musl
on:
  workflow_dispatch:
    inputs:
      enable_upx:
        description: Enable UPX compression
        type: boolean
        required: true
        default: false

env:
  MUSL_TOOLCHAIN_URL: "https://github.com/richfelker/musl-cross-make/releases/download/v10.3.0/arm-linux-musleabihf-cross.tgz"
  MUSL_TOOLCHAIN_SHA256: "956c3ee796eaef095d36e2f6c0d83b63294c776263595fec6600c739e83262aa"
  TINC_VERSION: "1.0.36"
  TINC_SHA256: "131435e022f18f95cbe1f2e32230113dd3170e9b92f7678564f3312b9325997d"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare system & install packages
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential upx file qemu-user-static curl
          command -v qemu-arm-static >/dev/null || { echo "Missing qemu-arm-static"; exit 1; }

      - name: Cache musl cross toolchain
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: /opt/musl-toolchain
          key: musl-armv7hf-10.3.0-${{ env.MUSL_TOOLCHAIN_SHA256 }}

      - name: Download & verify musl toolchain
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/musl-toolchain
          sudo chown $USER:$USER /opt/musl-toolchain
          if [[ "${{ steps.cache-toolchain.outputs.cache-hit }}" != "true" ]]; then
            rm -rf /opt/musl-toolchain/*
            curl -f --connect-timeout 30 --retry 3 "${{ env.MUSL_TOOLCHAIN_URL }}" -o /tmp/toolchain.tgz
            echo "${{ env.MUSL_TOOLCHAIN_SHA256 }}  /tmp/toolchain.tgz" | sha256sum -c -
            tar -xzf /tmp/toolchain.tgz -C /opt/musl-toolchain --strip-components=1
            rm -f /tmp/toolchain.tgz
          fi
          echo "/opt/musl-toolchain/bin" >> $GITHUB_PATH
          sudo chown -R $USER:$USER /opt/musl-toolchain

      - name: Fetch & verify tinc source
        run: |
          set -euo pipefail
          SRC_TAR="tinc-${{ env.TINC_VERSION }}.tar.gz"
          if [[ ! -f "$SRC_TAR" ]] || ! echo "${{ env.TINC_SHA256 }}  $SRC_TAR" | sha256sum -c - >/dev/null 2>&1; then
            rm -rf "$SRC_TAR" tinc-build
            curl -f --connect-timeout 30 --retry 3 "https://www.tinc-vpn.org/packages/$SRC_TAR" -o "$SRC_TAR"
            echo "${{ env.TINC_SHA256 }}  $SRC_TAR" | sha256sum -c -
          fi
          rm -rf tinc-build
          mkdir tinc-build
          tar -xzf "$SRC_TAR" -C tinc-build --strip-components=1

      - name: Build tinc static binary
        run: |
          set -euo pipefail
          command -v arm-linux-musleabihf-gcc >/dev/null
          command -v arm-linux-musleabihf-readelf >/dev/null

          cd tinc-build
          export CC=arm-linux-musleabihf-gcc
          export CXX=arm-linux-musleabihf-g++
          export CFLAGS="-O2 -march=armv7-a -mthumb -mfpu=neon-vfpv3 -mfloat-abi=hard"
          export LDFLAGS="-static -Wl,--gc-sections"

          echo "Compiler: $($CC --version | head -1)"
          echo "CFLAGS: $CFLAGS"

          ./configure \
            --host=arm-linux-musleabihf \
            --prefix=/tmp/tinc_install \
            --enable-static \
            --disable-shared \
            --disable-lzo \
            --disable-zlib \
            --with-openssl=no

          NPROC=$(nproc)
          JOBS=$(( NPROC > 4 ? 4 : NPROC ))
          make -j${JOBS} clean all
          make install

      - name: ELF audit + qemu test
        run: |
          set -euo pipefail
          TARGET=/tmp/tinc_install/sbin/tincd
          [[ -f "$TARGET" ]]

          echo "=== file ==="
          file "$TARGET"

          echo "=== readelf dynamic NEEDED check ==="
          if arm-linux-musleabihf-readelf -d "$TARGET" 2>/dev/null | grep NEEDED; then
            echo "ERROR: found dynamic dependencies!"
            exit 1
          fi

          echo "=== QEMU test (armv7 generic) ==="
          qemu-arm-static "$TARGET" --version

          echo "=== pre-upx size ==="
          ls -lh "$TARGET"

          if [[ "${{ github.event.inputs.enable_upx }}" == "true" ]]; then
            upx --best "$TARGET"
            upx -t "$TARGET"
            echo "=== post-upx readelf check ==="
            if arm-linux-musleabihf-readelf -d "$TARGET" 2>/dev/null | grep NEEDED; then
              echo "ERROR: UPX introduced dynamic dependency!"
              exit 1
            fi
            echo "=== post-upx qemu test ==="
            qemu-arm-static "$TARGET" --version
            echo "=== post-upx size ==="
            ls -lh "$TARGET"
          fi

          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          FINAL_NAME="tincd-v${{ env.TINC_VERSION }}-armv7hf-musl-${SHORT_SHA}"
          mv "$TARGET" "/tmp/$FINAL_NAME"
          echo "FINAL_NAME=$FINAL_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_NAME }}
          path: /tmp/${{ env.FINAL_NAME }}
