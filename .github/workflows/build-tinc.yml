name: Production Industrial-Grade Tinc Build for BE3600

on:
  workflow_dispatch:
    inputs:
      tinc_version:
        description: 'Tinc Release Version'
        required: true
        default: '1.0.36'
      enable_upx:
        description: 'Enable UPX Compression'
        type: boolean
        required: true
        default: true

env:
  MUSL_TOOLCHAIN_SHA256: "956c3ee796eaef095d36e2f6c0d83b63294c776263595fec6600c739e83262aa"
  TINC_1_0_36_SHA256: "131435e022f18f95cbe1f2e32230113dd3170e9b92f7678564f3312b9325997d"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Cleanup & Install Tools
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/tinc_* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential upx file qemu-user-static curl

          command -v qemu-arm-static >/dev/null 2>&1 || { echo "ERROR: qemu-arm-static not found!"; exit 1; }

      - name: Cache Musl Toolchain
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: /opt/musl-toolchain
          key: musl-toolchain-armv7hf-${{ env.MUSL_TOOLCHAIN_SHA256 }}

      # 方案一：强抗网络抖动 + 备用节点容灾
      - name: Download & Verify Musl Toolchain
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/musl-toolchain
          sudo chown -R $USER:$USER /opt/musl-toolchain

          if [ "${{ steps.cache-toolchain.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss. Downloading Musl Toolchain..."
            rm -rf /opt/musl-toolchain/*
            
            PRIMARY_URL="https://more.musl.cc/10.3.0/x86_64-linux-musl/arm-linux-musleabihf-cross.tgz"
            
            # 使用强容错参数：允许 HTTP 错误重试、设置 30s 握手超时、自动重试 5 次
            if ! curl -f -sSL --connect-timeout 30 --max-time 300 --retry 5 --retry-delay 5 --retry-all-errors "$PRIMARY_URL" -o /tmp/toolchain.tgz; then
              echo "Primary source failed or timed out. Retrying with fallback node..."
              curl -f -sSL --connect-timeout 30 --max-time 300 --retry 5 --retry-delay 5 --retry-all-errors "https://musl.cc/arm-linux-musleabihf-cross.tgz" -o /tmp/toolchain.tgz
            fi
            
            echo "Verifying Toolchain SHA256..."
            echo "${MUSL_TOOLCHAIN_SHA256}  /tmp/toolchain.tgz" | sha256sum -c - || { echo "ERROR: Toolchain Hash Mismatch!"; exit 1; }
            
            tar -xzf /tmp/toolchain.tgz -C /opt/musl-toolchain --strip-components=1
            rm -f /tmp/toolchain.tgz
          fi

          sudo chown -R $USER:$USER /opt/musl-toolchain
          echo "/opt/musl-toolchain/bin" >> $GITHUB_PATH

      - name: Cache Tinc Source & Build Directory
        id: cache-source
        uses: actions/cache@v3
        with:
          path: |
            tinc-${{ github.event.inputs.tinc_version }}.tar.gz
            tinc-build-dir
          key: tinc-src-${{ github.event.inputs.tinc_version }}-${{ env.TINC_1_0_36_SHA256 }}

      - name: Download & Verify Tinc Source
        run: |
          set -euo pipefail
          SRC_TAR="tinc-${{ github.event.inputs.tinc_version }}.tar.gz"
          
          if [ ! -f "$SRC_TAR" ] || ! echo "${TINC_1_0_36_SHA256}  $SRC_TAR" | sha256sum -c - >/dev/null 2>&1; then
            echo "Source archive invalid or missing. Fetching..."
            rm -rf "$SRC_TAR" tinc-build-dir
            curl -f -sSL --connect-timeout 30 --max-time 300 --retry 5 --retry-delay 5 --retry-all-errors "https://www.tinc-vpn.org/packages/$SRC_TAR" -o "$SRC_TAR"
            echo "${TINC_1_0_36_SHA256}  $SRC_TAR" | sha256sum -c - || { echo "ERROR: Source Tarball Hash Mismatch!"; exit 1; }
          fi

          if [ ! -d "tinc-build-dir" ]; then
            mkdir -p tinc-build-dir
            tar -xzf "$SRC_TAR" -C tinc-build-dir --strip-components=1
          fi

      - name: Build Tinc Binary
        run: |
          set -euo pipefail
          
          command -v arm-linux-musleabihf-gcc >/dev/null 2>&1 || { echo "ERROR: Cross Compiler missing!"; exit 1; }
          command -v arm-linux-musleabihf-readelf >/dev/null 2>&1 || { echo "ERROR: Readelf missing!"; exit 1; }

          rm -rf /tmp/tinc_install
          mkdir -p /tmp/tinc_install

          cd tinc-build-dir

          export CC="arm-linux-musleabihf-gcc"
          export CXX="arm-linux-musleabihf-g++"
          export CFLAGS="-O2 -march=armv7-a -mthumb -mfpu=neon-vfpv3 -mfloat-abi=hard"
          export LDFLAGS="-static -Wl,--gc-sections"

          echo "=== Cross Compiler Info ==="
          ${CC} --version
          echo "=== Readelf Info ==="
          arm-linux-musleabihf-readelf --version | head -n 1
          echo "=== CFLAGS: ${CFLAGS} ==="

          ./configure \
            --host=arm-linux-musleabihf \
            --prefix=/tmp/tinc_install \
            --enable-static \
            --disable-shared \
            --disable-lzo \
            --disable-zlib \
            --with-openssl=no || { echo "ERROR: Configure failed!"; exit 1; }

          NPROC=$(nproc)
          JOBS=$(( NPROC > 4 ? 4 : NPROC ))
          make -j${JOBS} || { echo "ERROR: Make failed!"; exit 1; }
          make install || { echo "ERROR: Make install failed!"; exit 1; }

      - name: Audit, Secondary Check & Artifact Package
        run: |
          set -euo pipefail
          TARGET_BIN="/tmp/tinc_install/sbin/tincd"
          
          if [ ! -f "$TARGET_BIN" ]; then
            echo "ERROR: Output binary missing!"
            exit 1
          fi

          echo "=== 1. File ELF Format Audit ==="
          file "$TARGET_BIN"

          echo "=== 2. Pre-UPX Readelf Dynamic Dependency Check ==="
          if arm-linux-musleabihf-readelf -d "$TARGET_BIN" 2>/dev/null | grep -q "NEEDED"; then
            echo "ERROR: Binary contains dynamic library dependencies! Failed static test."
            exit 1
          fi
          echo "SUCCESS: 0 Dynamic dependencies found."

          echo "=== 3. Raw Binary Size Audit ==="
          ls -lh "$TARGET_BIN"

          echo "=== 4. QEMU ARM (Cortex-A53) Pre-execution Test ==="
          qemu-arm-static -cpu cortex-a53 "$TARGET_BIN" --version

          if [ "${{ github.event.inputs.enable_upx }}" = "true" ]; then
            echo "=== 5. Applying UPX Compression ==="
            upx --best "$TARGET_BIN"
            upx -t "$TARGET_BIN"
            
            echo "=== 6. Post-UPX Secondary Readelf Dependency Check ==="
            if arm-linux-musleabihf-readelf -d "$TARGET_BIN" 2>/dev/null | grep -q "NEEDED"; then
              echo "ERROR: Post-UPX binary introduced dynamic links!"
              exit 1
            fi

            echo "=== 7. Post-UPX Compressed Size Audit ==="
            ls -lh "$TARGET_BIN"

            echo "=== 8. Post-UPX QEMU Execution Test ==="
            qemu-arm-static -cpu cortex-a53 "$TARGET_BIN" --version
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          CLEAN_VER=$(echo "${{ github.event.inputs.tinc_version }}" | tr -cd 'a-zA-Z0-9._-')
          
          FINAL_NAME="tincd-v${CLEAN_VER}-armv7hf-${SHORT_SHA}"
          FINAL_NAME=$(echo "$FINAL_NAME" | cut -c1-40)

          if [ -z "$FINAL_NAME" ] || [ "$FINAL_NAME" = "tincd-" ]; then
            FINAL_NAME="tincd-armv7hf-static-${SHORT_SHA}"
          fi
          
          mv "$TARGET_BIN" "/tmp/$FINAL_NAME" || { echo "ERROR: File move failed!"; exit 1; }
          echo "FINAL_NAME=$FINAL_NAME" >> $GITHUB_ENV

      # 已更新为正确的 upload-artifact@v4
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_NAME }}
          path: /tmp/${{ env.FINAL_NAME }}
