# =============================================================================
# Optimized tincd 1.0.36 static build for Xiaomi 4A Gigabit (MIPSEL, Musl, OpenSSL)
# =============================================================================

name: Build tincd for Xiaomi 4A (MIPSEL)

on:
  workflow_dispatch:
    inputs:
      tinc_version:
        description: 'Tinc Release Version'
        required: true
        default: '1.0.36'
      openssl_version:
        description: 'OpenSSL Version'
        required: true
        default: '3.0.13'
      enable_upx:
        description: 'Enable UPX Compression'
        type: boolean
        required: true
        default: true

env:
  # 使用成熟的 mipsel-linux-musl 交叉编译工具链
  TOOLCHAIN_URL: "https://github.com/userdocs/qbt-musl-cross-make/releases/download/2640/mipsel-linux-musl.tar.xz"
  TOOLCHAIN_SHA256: "b0b2e84d436ff1185f0ef3d102e3b2e9ccf0c189fb913ee8964d50d036e4f3a9" # 请根据实际工具链校验调整，或者使用 musl-cross
  OPENSSL_SHA256: "88525753f79d3bec27d2fa7c66aa0b92b3aa9498dafd93d7cfa4b3780cdae313"
  TINC_SHA256: "04d87f81335ca32f00a5be1fc94d13fae9d8ae3a65452b76df259cb44a1afa78"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: System Cleanup & Install Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential perl xz-utils file curl upx qemu-user-static
          # 检查 MIPS 模拟器是否支持
          command -v qemu-mipsel-static >/dev/null 2>&1 || sudo apt-get install -y qemu-user-static

      # 1. MIPS 工具链缓存与下载
      - name: Cache Mips Musl Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/musl-toolchain
          key: musl-toolchain-mipsel-${{ env.TOOLCHAIN_SHA256 }}

      - name: Download & Verify Mips Toolchain
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-toolchain.outputs.cache-hit }}" != "true" ]; then
            sudo rm -rf /opt/musl-toolchain
            sudo mkdir -p /opt/musl-toolchain
            sudo chown -R $USER:$USER /opt/musl-toolchain

            curl -f -sSL --connect-timeout 20 --max-time 300 --retry 4 "${{ env.TOOLCHAIN_URL }}" -o /tmp/toolchain.tar.xz
            tar -xJf /tmp/toolchain.tar.xz -C /opt/musl-toolchain --strip-components=1
            rm -f /tmp/toolchain.tar.xz
          fi
          echo "/opt/musl-toolchain/bin" >> $GITHUB_PATH

      # 2. OpenSSL 静态编译 (针对 MIPSEL 优化)
      - name: Cache Static OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /tmp/openssl_install
          key: openssl-static-mipsel-${{ github.event.inputs.openssl_version }}-${{ env.OPENSSL_SHA256 }}

      - name: Build Static OpenSSL (MIPSEL)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/openssl-src
          curl -f -sSL --retry 4 "https://www.openssl.org/source/openssl-${{ github.event.inputs.openssl_version }}.tar.gz" -o /tmp/openssl.tar.gz
          echo "${{ env.OPENSSL_SHA256 }}  /tmp/openssl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openssl.tar.gz -C /tmp/openssl-src --strip-components=1

          cd /tmp/openssl-src
          export CC="mipsel-linux-musl-gcc"
          # MIPS 架构使用软浮点与兼容指令，关闭无用模块以防止 configure 阶段由于未知汇编报错
          export CFLAGS="-O2 -march=mips32r2 -msoft-float"

          ./Configure linux-mipsel -static \
            --prefix=/tmp/openssl_install \
            --openssldir=/tmp/openssl_install \
            no-shared \
            no-asm \
            no-engine \
            no-async \
            no-tests \
            no-legacy \
            no-ssl3 \
            no-weak-ssl-ciphers

          make -j$(nproc)
          make install_sw

      # 3. 下载与校验 Tinc 源码
      - name: Download & Verify Tinc Source
        run: |
          set -euo pipefail
          mkdir -p /tmp/tinc-src
          curl -f -sSL --retry 4 "https://codeload.github.com/gsliepen/tinc/tar.gz/refs/tags/release-${{ github.event.inputs.tinc_version }}" -o /tmp/tinc.tar.gz
          echo "${{ env.TINC_SHA256 }}  /tmp/tinc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tinc.tar.gz -C /tmp/tinc-src --strip-components=1
          cd /tmp/tinc-src && autoreconf -i

      # 4. 配置与交叉编译 Tinc (解决编译器测试报错的关键步骤)
      - name: Build Static tincd for MIPSEL
        run: |
          set -euo pipefail
          command -v mipsel-linux-musl-gcc >/dev/null 2>&1 || { echo "Cross Compiler missing!"; exit 1; }

          cd /tmp/tinc-src
          export CC="mipsel-linux-musl-gcc"
          export CXX="mipsel-linux-musl-g++"
          
          # 关键：在这里注入静态编译参数，确保 configure 阶段能够成功完成测试链接
          export CFLAGS="-O2 -march=mips32r2 -msoft-float -ffunction-sections -fdata-sections"
          export CPPFLAGS="-I/tmp/openssl_install/include"
          export LDFLAGS="-static -Wl,--gc-sections -L/tmp/openssl_install/lib"
          export LIBS="-ldl -lpthread -latomic"

          ./configure \
            --host=mipsel-linux-musl \
            --prefix=/tmp/tinc_install \
            --disable-lzo \
            --disable-zlib \
            --with-openssl=/tmp/openssl_install || { cat config.log; exit 1; }

          make -C src -j$(nproc)
          make -C src install

      # 5. ELF 审计、QEMU MIPS 模拟测试与打包
      - name: Audit, QEMU Test & Package
        run: |
          set -euo pipefail
          TARGET_BIN="/tmp/tinc_install/sbin/tincd"
          [ -f "$TARGET_BIN" ] || { echo "Output binary missing!"; exit 1; }

          echo "=== 1. File Type ==="
          file "$TARGET_BIN"
          mipsel-linux-musl-readelf -h "$TARGET_BIN"

          echo "=== 2. Static Dependency Check ==="
          if mipsel-linux-musl-readelf -d "$TARGET_BIN" 2>/dev/null | grep -q "NEEDED"; then
            echo "ERROR: Dynamic dependencies found!"; exit 1
          fi
          echo "SUCCESS: 0 Dynamic dependencies found."

          echo "=== 3. Strip Symbols ==="
          mipsel-linux-musl-strip --strip-all "$TARGET_BIN"
          ls -lh "$TARGET_BIN"

          echo "=== 4. QEMU MIPSEL Real Execution Test ==="
          qemu-mipsel-static "$TARGET_BIN" --version

          if [ "${{ github.event.inputs.enable_upx }}" = "true" ]; then
            echo "=== 5. UPX Compression ==="
            upx --best --lzma "$TARGET_BIN" || echo "WARNING: UPX failed"
            qemu-mipsel-static "$TARGET_BIN" --version
          fi

          CLEAN_VER=$(echo "${{ github.event.inputs.tinc_version }}" | tr -cd 'a-zA-Z0-9._-')
          NAME="tincd-v${CLEAN_VER}-mipsel-musl-static"
          cp "$TARGET_BIN" "/tmp/$NAME"
          (cd /tmp && sha256sum "$NAME" > "$NAME.sha256")

          {
            echo "artifact: $NAME"
            echo "tinc_version: ${{ github.event.inputs.tinc_version }}"
            echo "arch: MIPSEL (Xiaomi 4A / MT7621A, mips32r2)"
            echo "static: yes (0 dynamic deps)"
            echo "sha256: $(awk '{print $1}' /tmp/$NAME.sha256)"
          } > "/tmp/$NAME.meta"

          echo "FINAL_NAME=$NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_NAME }}
          path: |
            /tmp/${{ env.FINAL_NAME }}
            /tmp/${{ env.FINAL_NAME }}.sha256
            /tmp/${{ env.FINAL_NAME }}.meta
