# =============================================================================
# tincd 1.0.36 static build for Xiaomi Router 4A Gigabit (Mipsel, MT7621A)
# =============================================================================

name: Reproduce tincd static build for Xiaomi 4A Gigabit (MT7621A)

on:
  workflow_dispatch:
    inputs:
      tinc_version:
        description: 'Tinc Release Version'
        required: true
        default: '1.0.36'
      openssl_version:
        description: 'OpenSSL Version'
        required: true
        default: '3.0.13'
      enable_upx:
        description: 'Enable UPX Compression'
        type: boolean
        required: true
        default: true
      enable_lto:
        description: 'Enable LTO (-flto, experimental, default off)'
        type: boolean
        required: true
        default: false

env:
  TOOLCHAIN_URL: "https://github.com/userdocs/qbt-musl-cross-make/releases/download/2640/x86_64-mipsel-linux-musl.tar.xz"
  TOOLCHAIN_SHA256: "612ca4fb4cacec035f75b7b965ba34272a45f49d755c0b874fbb9bc9b60522eb"
  OPENSSL_SHA256: "88525753f79d3bec27d2fa7c66aa0b92b3aa9498dafd93d7cfa4b3780cdae313"
  TINC_SHA256: "04d87f81335ca32f00a5be1fc94d13fae9d8ae3a65452b76df259cb44a1afa78"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: System Cleanup & Install Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential perl xz-utils file curl upx qemu-user-static
          command -v qemu-mipsel-static >/dev/null 2>&1 || { echo "ERROR: qemu-mipsel-static missing!"; exit 1; }

      # 1. Mipsel 工具链缓存与下载
      - name: Cache Musl Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/musl-toolchain
          key: musl-toolchain-mipsel-${{ env.TOOLCHAIN_SHA256 }}

      - name: Download & Verify Musl Toolchain
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-toolchain.outputs.cache-hit }}" != "true" ]; then
            sudo rm -rf /opt/musl-toolchain
            sudo mkdir -p /opt/musl-toolchain
            sudo chown -R $USER:$USER /opt/musl-toolchain

            curl -f -sSL --connect-timeout 20 --max-time 300 --retry 4 "${{ env.TOOLCHAIN_URL }}" -o /tmp/toolchain.tar.xz
            echo "${{ env.TOOLCHAIN_SHA256 }}  /tmp/toolchain.tar.xz" | sha256sum -c - || { echo "Toolchain Hash Mismatch!"; exit 1; }
            tar -xJf /tmp/toolchain.tar.xz -C /opt/musl-toolchain --strip-components=1
            rm -f /tmp/toolchain.tar.xz
          fi
          echo "/opt/musl-toolchain/bin" >> $GITHUB_PATH

      # 2. OpenSSL 静态编译缓存 (MT7621A 适配)
      - name: Cache Static OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /tmp/openssl_install
          key: openssl-static-mipsel-${{ github.event.inputs.openssl_version }}-${{ env.OPENSSL_SHA256 }}

      - name: Build Static OpenSSL (Mipsel)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/openssl-src
          curl -f -sSL --retry 4 "https://www.openssl.org/source/openssl-${{ github.event.inputs.openssl_version }}.tar.gz" -o /tmp/openssl.tar.gz
          echo "${{ env.OPENSSL_SHA256 }}  /tmp/openssl.tar.gz" | sha256sum -c - || { echo "OpenSSL Hash Mismatch!"; exit 1; }
          tar -xzf /tmp/openssl.tar.gz -C /tmp/openssl-src --strip-components=1

          cd /tmp/openssl-src
          export CC="mipsel-linux-musl-gcc"
          export CFLAGS="-O2 -march=mips32r2 -msoft-float -ffunction-sections -fdata-sections"

          # 目标用 linux-mips32（linux-mipsel 在 OpenSSL 3.0.13 中不存在）
          ./Configure linux-mips32 -static \
            --prefix=/tmp/openssl_install \
            --openssldir=/tmp/openssl_install \
            no-shared \
            no-engine \
            no-async \
            no-tests \
            no-legacy \
            no-ssl3 \
            no-weak-ssl-ciphers \
            -march=mips32r2 -msoft-float

          make -j$(nproc)
          make install_sw

      # 3. 下载与校验 Tinc 源码
      - name: Cache Tinc Source
        id: cache-tinc
        uses: actions/cache@v4
        with:
          path: |
            /tmp/tinc.tar.gz
            /tmp/tinc-src
          key: tinc-${{ github.event.inputs.tinc_version }}-${{ env.TINC_SHA256 }}

      - name: Download & Verify Tinc Source
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-tinc.outputs.cache-hit }}" != "true" ]; then
            rm -rf /tmp/tinc.tar.gz /tmp/tinc-src
            mkdir -p /tmp/tinc-src
            curl -f -sSL --retry 4 "https://codeload.github.com/gsliepen/tinc/tar.gz/refs/tags/release-${{ github.event.inputs.tinc_version }}" -o /tmp/tinc.tar.gz
            echo "${{ env.TINC_SHA256 }}  /tmp/tinc.tar.gz" | sha256sum -c - || { echo "Tinc Hash Mismatch!"; exit 1; }
            tar -xzf /tmp/tinc.tar.gz -C /tmp/tinc-src --strip-components=1
            cd /tmp/tinc-src && autoreconf -i
          fi

      # 4. 配置与交叉编译 Tinc
      - name: Build Static tincd
        run: |
          set -euo pipefail
          command -v mipsel-linux-musl-gcc >/dev/null 2>&1 || { echo "Cross Compiler missing!"; exit 1; }

          cd /tmp/tinc-src
          export CC="mipsel-linux-musl-gcc"
          export CXX="mipsel-linux-musl-g++"

          export CFLAGS="-O2 -march=mips32r2 -msoft-float -ffunction-sections -fdata-sections -fno-asynchronous-unwind-tables"
          export CPPFLAGS="-I/tmp/openssl_install/include"
          export LDFLAGS="-static -Wl,--gc-sections -Wl,-O1 -L/tmp/openssl_install/lib"
          export LIBS="-ldl -lpthread -latomic"

          if [ "${{ github.event.inputs.enable_lto }}" = "true" ]; then
            export CFLAGS="$CFLAGS -flto"
            export LDFLAGS="$LDFLAGS -flto"
          fi

          ./configure \
            --host=mipsel-linux-musl \
            --prefix=/tmp/tinc_install \
            --disable-lzo \
            --disable-zlib \
            --with-openssl=/tmp/openssl_install || { echo "Configure failed!"; exit 1; }

          make -C src -j$(nproc) || { echo "Make failed!"; exit 1; }
          make -C src install || { echo "Install failed!"; exit 1; }

      # 5. ELF 静态审计、QEMU 测试、Strip & UPX 压缩
      - name: Audit, QEMU Test & Package
        run: |
          set -euo pipefail
          TARGET_BIN="/tmp/tinc_install/sbin/tincd"
          [ -f "$TARGET_BIN" ] || { echo "Output binary missing!"; exit 1; }

          echo "=== 1. File Type & ELF Headers ==="
          FT=$(file "$TARGET_BIN")
          echo "$FT"

          echo "=== 1b. Arch/Endian Hard Check (must be LSB MIPS32r2) ==="
          case "$FT" in
            *"ELF 32-bit LSB"*"MIPS"*"MIPS32 rel2"*) echo "PASS: Little-Endian MIPS32r2";;
            *) echo "FAIL: unexpected arch/endian: $FT"; exit 1;;
          esac

          echo "=== 2. Static Dependency Check ==="
          if mipsel-linux-musl-readelf -d "$TARGET_BIN" 2>/dev/null | grep -q "NEEDED"; then
            echo "ERROR: Dynamic dependencies found!"; exit 1
          fi
          echo "SUCCESS: 0 Dynamic dependencies found."

          echo "=== 3. Strip Symbols ==="
          mipsel-linux-musl-strip --strip-all "$TARGET_BIN"
          ls -lh "$TARGET_BIN"

          echo "=== 4. QEMU Mipsel Real Execution Test ==="
          qemu-mipsel-static "$TARGET_BIN" --version || { echo "ERROR: QEMU run failed!"; exit 1; }

          if [ "${{ github.event.inputs.enable_upx }}" = "true" ]; then
            echo "=== 5. UPX Compression ==="
            if upx --best --lzma "$TARGET_BIN"; then
              upx -t "$TARGET_BIN"
              echo "=== 6. Post-UPX Static Check ==="
              if mipsel-linux-musl-readelf -d "$TARGET_BIN" 2>/dev/null | grep -q "NEEDED"; then
                echo "ERROR: post-UPX dynamic links!"; exit 1
              fi
              echo "=== 7. Post-UPX QEMU Execution Test ==="
              qemu-mipsel-static "$TARGET_BIN" --version || { echo "ERROR: post-UPX QEMU failed!"; exit 1; }
              ls -lh "$TARGET_BIN"
            else
              echo "WARNING: UPX compression failed, using original stripped binary."
            fi
          fi

          CLEAN_VER=$(echo "${{ github.event.inputs.tinc_version }}" | tr -cd 'a-zA-Z0-9._-')
          NAME="tincd-v${CLEAN_VER}-mipsel-musl-static"
          cp "$TARGET_BIN" "/tmp/$NAME"
          (cd /tmp && sha256sum "$NAME" > "$NAME.sha256")

          {
            echo "artifact: $NAME"
            echo "tinc_version: ${{ github.event.inputs.tinc_version }}"
            echo "openssl_version: ${{ github.event.inputs.openssl_version }}"
            echo "toolchain: musl-cross-make prebuilt (mipsel / musl)"
            echo "arch: MIPS32r2 Little-Endian (MT7621A), soft-float"
            echo "static: yes (static-pie, 0 dynamic deps)"
            echo "upx: ${{ github.event.inputs.enable_upx }}"
            echo "sha256: $(awk '{print $1}' /tmp/$NAME.sha256)"
          } > "/tmp/$NAME.meta"

          echo "FINAL_NAME=$NAME" >> $GITHUB_ENV

      # 6. 上传 Artifact 交付物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_NAME }}
          path: |
            /tmp/${{ env.FINAL_NAME }}
            /tmp/${{ env.FINAL_NAME }}.sha256
            /tmp/${{ env.FINAL_NAME }}.meta
